# Replace the auto-detected build phase. nixpacks would run `npm run build`
# (= `tsc --noEmit`), but `typescript` is a devDependency and Railway
# installs with NODE_ENV=production, so `tsc: not found` failed the build
# intermittently. The deploy needs no compile step: `start:prod` is
# `tsx ./src` (compiles at runtime) and the typecheck runs in CI.
#
# This runs `npm ci` rather than a no-op `echo`: the nixpacks install-layer
# cache has intermittently been restored incomplete, leaving node_modules
# short of runtime deps at boot (`Cannot find package '@trpc/server'` —
# crash loop, healthcheck never passes, deploy FAILED even though the same
# commit + config had deployed clean minutes before). `npm ci` wipes and
# rebuilds node_modules here in the build phase, so a stale/partial install
# layer can't reach runtime. Costs ~30–60s/deploy. Still NOT railway.toml's
# buildCommand — that replaces nixpacks' entire build incl. base setup.
[phases.build]
cmds = ["npm ci --omit=dev"]
