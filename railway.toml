[build]
builder = "nixpacks"
# The build phase is neutered in nixpacks.toml (skips `tsc --noEmit`, which
# needs the `typescript` devDep that prod install omits). NOT set here as
# `buildCommand` — that replaces nixpacks' whole build incl. `npm ci`, so
# node_modules ended up missing at runtime.

[deploy]
# Migrations run on boot in src/index.ts (production only) — the Railway
# preDeployCommand approach intermittently hung its container and failed
# the whole deploy.
startCommand = "npm run start:prod"
healthcheckPath = "/health"
# 10s was too tight — a cold `tsx ./src` start esbuild-compiles the whole
# app and intermittently answers /health after >10s, which failed the
# healthcheck and the whole deploy (roughly every other deploy). 300s is
# Railway's own default.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
