[build]
builder = "nixpacks"

[deploy]
# Apply pending drizzle migrations before the new release goes live, so a
# schema change ships atomically with the code that needs it (Railway runs
# this once per deploy, after build, before startCommand / traffic switch).
# Uses drizzle-orm's migrator (src/db/migrate.ts) rather than `npm run m`
# so it needs nothing from devDependencies (Railway installs prod-only).
preDeployCommand = "npm run migrate:deploy"
startCommand = "npm run start:prod"
healthcheckPath = "/health"
# 10s was too tight — a cold `tsx ./src` start esbuild-compiles the whole
# app and intermittently answers /health after >10s, which failed the
# healthcheck and the whole deploy (roughly every other deploy). 300s is
# Railway's own default.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
