# Replace the auto-detected build phase. nixpacks would run `npm run build`
# (= `tsc --noEmit`), but `typescript` is a devDependency and Railway
# installs with NODE_ENV=production, so `tsc: not found` failed the build
# intermittently. The deploy needs no compile step: `start:prod` is
# `tsx ./src` (compiles at runtime) and the typecheck runs in CI.
#
# This re-runs the install rather than a no-op `echo`: the nixpacks
# install-layer cache has intermittently been restored incomplete, leaving
# node_modules short of runtime deps at boot (`Cannot find package
# '@trpc/server'` — crash loop, healthcheck never passes, deploy FAILED
# even though the same commit + config had deployed clean minutes before).
#
# It's `npm install`, NOT `npm ci`: nixpacks mounts a build cache at
# `/app/node_modules/.cache`, and `npm ci` starts by `rmdir`-ing all of
# node_modules — which fails EBUSY on that mount (exit 240, build dies).
# `npm install` reconciles against the lockfile in place: it completes a
# partial tree without wiping it, so it both repairs the flake and coexists
# with the cache mount. Idempotent (~seconds) when the tree is already
# whole. Still NOT railway.toml's buildCommand — that replaces nixpacks'
# entire build incl. base setup.
[phases.build]
cmds = ["npm install --omit=dev --no-audit --no-fund"]
