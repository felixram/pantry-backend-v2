# Replace the auto-detected build phase. nixpacks would run `npm run build`
# (= `tsc --noEmit`), but `typescript` is a devDependency and Railway
# installs with NODE_ENV=production, so `tsc: not found` failed the build
# intermittently. The deploy needs no compile step: `start:prod` is
# `tsx ./src` (compiles at runtime) and the typecheck runs in CI.
#
# This re-runs the install (rather than a no-op `echo`) as a safety net:
# `Cannot find package '@trpc/server'` at boot (crash loop, deploy FAILED)
# turned out to be caused by @trpc/server + cors genuinely being
# misclassified as devDependencies while imported at runtime by
# src/index.ts — Railway's NODE_ENV=production install honors the
# lockfile's per-package `dev` flag and omits them, non-deterministically
# with the nixpacks layer cache (matches the earlier `tsc: not found`
# flakiness exactly). The real fix is the dependencies/devDependencies
# split in package.json; this step just re-verifies node_modules is
# complete against the (now-correct) lockfile every deploy.
#
# It's `npm install`, NOT `npm ci`: nixpacks mounts a build cache at
# `/app/node_modules/.cache`, and `npm ci` starts by `rmdir`-ing all of
# node_modules — which fails EBUSY on that mount (exit 240, build dies).
# `npm install` reconciles in place without wiping the tree, so it
# coexists with the mount. Idempotent (~seconds) once nothing's missing.
# Still NOT railway.toml's buildCommand — that replaces nixpacks' entire
# build incl. base setup.
[phases.build]
cmds = ["npm install --omit=dev --no-audit --no-fund"]
