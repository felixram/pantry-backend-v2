[build]
builder = "nixpacks"
# Skip nixpacks' auto-detected `npm run build` (= `tsc --noEmit`). It needs
# `typescript`, a devDependency that Railway's NODE_ENV=production install
# omits, so `tsc: not found` failed the build ~half the time (whenever the
# nixpacks cache didn't happen to carry it). The deploy doesn't need a
# build: `start:prod` runs `tsx ./src` (compiles at runtime) and the
# typecheck already runs in CI.
buildCommand = "echo 'skip: typecheck runs in CI, runtime is tsx'"

[deploy]
# Migrations run on boot in src/index.ts (production only) — the Railway
# preDeployCommand approach intermittently hung its container and failed
# the whole deploy.
startCommand = "npm run start:prod"
healthcheckPath = "/health"
# 10s was too tight — a cold `tsx ./src` start esbuild-compiles the whole
# app and intermittently answers /health after >10s, which failed the
# healthcheck and the whole deploy (roughly every other deploy). 300s is
# Railway's own default.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
